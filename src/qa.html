<body class="qa-page qa-start-page journey-page journey-qa-page" data-qa-page="start">
  <a class="skip-link" href="#main">跳至正文</a>
  <header class="site-header qa-header" id="site-header">
    <nav class="nav-shell" aria-label="主要导航">
      <a class="brand" href="index.html#top" aria-label="见众首页">

      </a>
      <button class="menu-toggle" type="button" aria-label="打开导航菜单" aria-expanded="false" aria-controls="nav-links">

      <div class="nav-links" id="nav-links">

      </div>
    </nav>
  </header>

  <main id="main" class="qa-main">
    <section class="qa-question-screen journey-question" aria-labelledby="qa-title">
      <div class="qa-question-layout journey-question-form">
        <div class="qa-intro-copy journey-question-heading">
          <p class="eyebrow">BEGIN WITH A QUESTION</p>
          <h1 id="qa-title">有什么让你纠结了<br><em>很久的事？</em></h1>
          <p>越具体越好。不需要一次说完整，我们会在对话里慢慢把它说清楚。</p>
        </div>

        <div class="qa-writing-panel" id="qa-workspace" aria-label="问答工作区">
          <form class="qa-start-card journey-writing-area" id="start-form" novalidate>
            <label class="qa-label" for="problem-input">写下让你纠结很久的事</label>
            <textarea id="problem-input" name="problem" rows="7" maxlength="8000" required>我大四要毕业了。是继续读博，去互联网公司工作，还是回家乡？我担心读博以后年龄越来越大，也担心现在不去工作会错过好的就业机会。</textarea>
            <div class="qa-form-footer journey-form-meta">
              <span>至少 8 个字符 · 支持在对话中继续补充</span>
              <button class="button button-dark" type="submit"><span>开始回答</span><span aria-hidden="true">→</span></button>
              <p class="qa-start-error journey-error" id="qa-start-error" role="alert" aria-live="polite"></p>
            </div>
          </form>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer qa-footer">
    <div class="container footer-bottom"><span>© 2026 见众</span><a href="#main" data-scroll-top>回到顶部 ↑</a></div>
